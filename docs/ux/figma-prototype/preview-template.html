<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDP · Prototype review</title><style>
*{box-sizing:border-box}body{margin:0;background:#d9e2ea;font:14px/1.5 system-ui,sans-serif;color:#142c42}header{padding:12px 20px;background:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap}select,header button{font:inherit;padding:7px;border:1px solid #526779;border-radius:6px;background:white;color:#142c42}button{cursor:pointer}#stage{position:relative;max-width:1440px;margin:20px auto;background:white}#stage svg{display:block;width:100%;height:auto}#stage button{position:absolute;background:transparent;border:0;padding:0}#stage button:hover{background:#17688718;outline:2px solid #17688788}#stage button:focus-visible{outline:3px solid #176887;outline-offset:-3px;background:#17688718}small{color:#526779}main{padding:0 12px 24px}
</style><header><strong>SDP · Local interaction review</strong><button id="home" type="button" onclick="show('login')">Restart</button><label>Screen <select id="screens"></select></label><small>Preset states. No live login, file upload or saved account data.</small></header><main><div id="stage" aria-label="Prototype screen"></div></main><script>
const screens=__SCREENS__;const stage=document.getElementById('stage'),select=document.getElementById('screens');
for(const s of screens){const o=document.createElement('option');o.value=s.key;o.textContent=s.name+' · '+s.key;select.appendChild(o);}
function show(key){const s=screens.find(s=>s.key===key)||screens[0];stage.innerHTML=s.svg;stage.style.maxWidth=s.width+'px';stage.dataset.screen=s.key;select.value=s.key;document.title=s.name+' · SDP prototype';for(const l of s.links){const b=document.createElement('button');b.setAttribute('aria-label',l.label);b.title=l.label;b.style.cssText=`left:${l.x/s.width*100}%;top:${l.y/s.height*100}%;width:${l.w/s.width*100}%;height:${l.h/s.height*100}%`;b.onclick=()=>{show(l.to);select.focus();};stage.appendChild(b);}window.scrollTo(0,0);}
select.onchange=()=>show(select.value);show('login');
</script></html>
